name: Update Heatmap

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Run script
        run: |
          pip install requests
          python generate.py

      - name: Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add heatmap.svg
          git commit -m "update heatmap" || echo "no changes"
          git push
